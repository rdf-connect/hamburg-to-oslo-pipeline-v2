[project]
name = "rdfc_road-snapper"
version = "0.0.1"
description = "A processor that snaps traffic measurement points to the nearest road segment from an OSM roads shapefile."
authors = [
    { name = "Movias" }
]
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"
dependencies = [
    "rdfc-proto>=1.0.0",
    "rdfc-runner>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyogrio>=0.7.0",
    "geopandas>=1.0.0",
]

[project.urls]
Homepage = "https://rdf-connect.github.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rdfc_road_snapper"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
system-packages = false
installer = "uv"
env-vars = { PYTHONPATH = "src" }
