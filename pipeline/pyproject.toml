[project]
name = "vienna-weather-forecast-kg-pipeline"
version = "0.0.1"
description = "RDF-Connect pipeline to ingest Vienna's weather forecast in a knowledge graph."
authors = [
    { name = "Ieben Smessaert", email = "ieben.smessaert@ugent.be" }
]
readme = "README.md"
requires-python = "==3.13.*"
license = "MIT"
dependencies = [
    "rdfc-runner",
    "rdfc-translation-processor",
    "rdflib>=7.6.0",
    "sacremoses>=0.1.1",
    "sentencepiece>=0.2.1",
    "torch>=2.12.0",
    "transformers==4.57.6",
]

[project.urls]
Homepage = "https://rdf-connect.github.io"
Repository = "https://github.com/rdf-connect/vienna-weather-forecast-kg-pipeline"
Issues = "https://github.com/rdf-connect/vienna-weather-forecast-kg-pipeline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resources"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
system-packages = false
installer = "uv"
env-vars = { PYTHONPATH = "src" }

[tool.uv.sources]
rdfc-translation-processor = { path = "../processor/translation-processor-py/dist/rdfc_translation_processor-0.0.1.tar.gz" }
rdfc-runner = { path = "../processor/py-runner/dist/rdfc_runner-1.0.0.tar.gz" }

