prefixes:
  rr: "http://www.w3.org/ns/r2rml#"
  rml: "http://semweb.mmlab.be/ns/rml#"
  ql: "http://semweb.mmlab.be/ns/ql#"
  dc: "http://purl.org/dc/elements/1.1/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  dct: "http://purl.org/dc/terms/"
  prov: "http://www.w3.org/ns/prov#"

  sosa: "http://www.w3.org/ns/sosa/"
  time: "http://www.w3.org/2006/time#"

  geo: "http://www.opengis.net/ont/geosparql#"
  sf: "http://www.opengis.net/ont/sf#"

  skos: "http://www.w3.org/2004/02/skos/core#"

  om: "http://def.isotc211.org/iso19156/2011/Observation#"

  verkeer: "https://data.vlaanderen.be/ns/mobiliteit#"
  verkeersmetingen: "https://data.vlaanderen.be/ns/verkeersmetingen#"

  cl-vrt: "https://data.vlaanderen.be/doc/concept/VkmVoertuigType/"
  cl-vkt: "https://data.vlaanderen.be/doc/concept/VkmVerkeersKenmerkType/"
  cl-mit: "https://data.vlaanderen.be/doc/concept/VkmMeetInstrumentType/"
  cl-trt: "https://inspire.ec.europa.eu/codelist/LinkDirectionValue/"

  ex: "https://example.org/id/"

sources:
  source:
    access: data.json
    referenceFormulation: jsonpath
    iterator: "$"

mappings:

  #################################################
  # Dataset
  #################################################
  dataset:
    sources:
      - source

    s: "ex:dataset/hamburg-verkeersmetingen"

    po:
      - p: a
        o: dct:Dataset

      - p: dct:title
        o: "Hamburg SensorThings verkeersmetingen"
        language: nl

      - p: dct:description
        o: "Verkeersmetingen gemapt vanuit Hamburg SensorThings API naar OSLO Verkeersmetingen."
        language: nl

      - p: dct:source
        o: "$(datastream['@iot.selfLink'])~iri"

      - p: dct:identifier
        o: "$(datastream.properties.serviceName)"


  #################################################
  # Verkeerstelling / Verkeersmeting
  #################################################
  verkeerstelling:
    sources:
      - source

    s: "ex:verkeerstelling/$(observation['@iot.id'])"

    po:
      - p: a
        o: verkeersmetingen:Verkeerstelling

      # If your validator also targets the generic superclass explicitly,
      # keeping this type is useful and normally harmless.
      - p: a
        o: verkeer:Verkeersmeting

      - p: dct:identifier
        o: "$(observation['@iot.id'])"

      - p: dct:source
        o: "$(observation['@iot.selfLink'])~iri"

      - p: dct:memberOf
        o: "ex:dataset/hamburg-verkeersmetingen~iri"

      - p: prov:generatedAtTime
        o: "$(observation.resultTime)"
        datatype: xsd:dateTime

      # OSLO: Verkeersmeting.geobserveerdKenmerk
      - p: verkeer:geobserveerdKenmerk
        o: "ex:verkeerstellingkenmerk/$(observation['@iot.id'])~iri"

      # OSLO: Verkeersmeting.geobserveerdObject
      - p: verkeer:geobserveerdObject
        o: "ex:verkeersmeetpunt/$(thing['@iot.id'])~iri"

      # OSLO: Verkeersmeting.fenomeenTijd
      - p: verkeer:fenomeenTijd
        o: "ex:tijdsinterval/$(observation['@iot.id'])~iri"

      # OSLO: Verkeersmeting.uitgevoerdMet
      - p: verkeer:uitgevoerdMet
        o: "ex:sensor/$(sensor['@iot.id'])~iri"

      # Keep SOSA compatibility as additional non-conflicting information.
      - p: sosa:madeBySensor
        o: "ex:sensor/$(sensor['@iot.id'])~iri"

      - p: sosa:phenomenonTime
        o: "ex:tijdsinterval/$(observation['@iot.id'])~iri"

      # Generic OM result. The OSLO examples map Verkeersmeting.resultaat
      # to om:OM_Observation.result.
      - p: om:OM_Observation.result
        o: "$(observation.result)"
        datatype: xsd:integer

      # Verkeerstelling-specific result property used in the AP examples.
      - p: verkeersmetingen:verkeerstellingTellingresultaat
        o: "$(observation.result)"
        datatype: xsd:integer


#################################################
  # Verkeerstellingkenmerk
  #################################################
  verkeerstellingkenmerk:
    sources:
      - source

    s: "ex:verkeerstellingkenmerk/$(observation['@iot.id'])"

    po:
      - p: a
        o: verkeersmetingen:Verkeerstellingkenmerk

      - p: a
        o: verkeersmetingen:Verkeerskenmerk

      # Required by SHACL as dc11:type.
      # dc11 = http://purl.org/dc/elements/1.1/
      - p: dc:type
        o: "cl-vkt:aantal~iri"

      # Vehicle type must point to a resource that is typed as skos:Concept.
      # Todo: check if cl-vrt is the wanted target type of vehicle. These are mapped from the german term of motorverhicle, which could entail any kind of vehicle that is not a heavy transport, which are measured separately. I am currently unsure if those heavy vehicles are also included in the regular counts, but my instinct says they are not.
      - p: verkeersmetingen:voertuigType
        o: "cl-vrt:auto~iri"

  #################################################
  # Verkeersmeetpunt
  #################################################
  verkeersmeetpunt:
    sources:
      - source

    s: "ex:verkeersmeetpunt/$(thing['@iot.id'])"

    po:
      - p: a
        o: verkeersmetingen:Verkeersmeetpunt

      - p: dct:identifier
        o: "$(thing.properties.assetID)"

      - p: rdfs:label
        o: "$(thing.name)"
        language: de

      - p: dct:description
        o: "$(thing.description)"
        language: de

      - p: dct:source
        o: "$(thing['@iot.selfLink'])~iri"

      - p: dct:modified
        o: "$(thing.properties.infoLastUpdate)"
        datatype: xsd:dateTime

      # OSLO examples use Verkeersmeetpunt.geometrie.
      - p: verkeersmetingen:geometrie
        o: "ex:geometrie/$(thing['@iot.id'])~iri"

      # Additional GeoSPARQL compatibility.
      - p: geo:hasGeometry
        o: "ex:geometrie/$(thing['@iot.id'])~iri"

      # Direction is intentionally not fully solved.
      # The linked node only stores the Hamburg free-text description.
      - p: verkeersmetingen:rijrichting
        o: "ex:rijrichting/$(datastream.properties.direction)~iri"


  #################################################
  # Rijrichting placeholder
  #################################################
  rijrichting:
    sources:
      - source

    s: "ex:rijrichting/$(datastream['@iot.id'])"

    po:
      - p: a
        o: verkeersmetingen:Rijrichting

      - p: rdfs:label
        o: "$(thing.properties.richtung)"
        language: de

      # This is the deliberate placeholder requested by you.
      # Your script can later replace/add a proper cl-trt:* value.
      - p: rdfs:comment
        o: "$(thing.properties.richtung)"
        language: de

  #################################################
  # Geometry
  #################################################
  geometrie:
    sources:
      - source

    s: "ex:geometrie/$(thing['@iot.id'])"

    po:
      - p: a
        o: geo:Geometry

      - p: a
        o: sf:Point

      # GeoSPARQL WKT uses x y = lon lat for EPSG:4326.
      - p: geo:asWKT
        o: "<http://www.opengis.net/def/crs/EPSG/0/4326> POINT ($(locations[0].location.geometry.coordinates[0]) $(locations[0].location.geometry.coordinates[1]))"
        datatype: geo:wktLiteral


  #################################################
  # Sensor / meetinstrument
  #################################################
  sensor:
    sources:
      - source

    s: "ex:sensor/$(sensor['@iot.id'])"

    po:
      - p: a
        o: sosa:Sensor

      - p: dct:identifier
        o: "$(sensor['@iot.id'])"

      - p: rdfs:label
        o: "$(sensor.name)"
        language: de

      - p: dct:description
        o: "$(sensor.description)"
        language: de

      - p: dct:source
        o: "$(sensor['@iot.selfLink'])~iri"

      - p: dct:modified
        o: "$(sensor.properties.infoLastUpdate)"
        datatype: xsd:dateTime

      # TODO: The OSLO implementation examples often classify the instrument type through cl-mit. Check for an exact mapping here if possible.


  #################################################
  # Phenomenon time interval
  #################################################
  tijdsinterval:
    sources:
      - source

    s: "ex:tijdsinterval/$(observation['@iot.id'])"

    po:
      - p: a
        o: time:TemporalEntity

      - p: a
        o: time:ProperInterval

      - p: time:hasBeginning
        o: "ex:tijdsinterval/$(observation['@iot.id'])/begin~iri"

      - p: time:hasEnd
        o: "ex:tijdsinterval/$(observation['@iot.id'])/einde~iri"

      - p: time:hasXSDDuration
        o: "$(observation.phenomenonTime.hasXSDDuration)"
        datatype: xsd:duration


  begin:
    sources:
      - source

    s: "ex:tijdsinterval/$(observation['@iot.id'])/begin"

    po:
      - p: a
        o: time:Instant

      - p: time:inXSDDateTimeStamp
        o: "$(observation.phenomenonTime.hasBeginning.inXSDDateTimeStamp)"
        datatype: xsd:dateTimeStamp


  einde:
    sources:
      - source

    s: "ex:tijdsinterval/$(observation['@iot.id'])/einde"

    po:
      - p: a
        o: time:Instant

      - p: time:inXSDDateTimeStamp
        o: "$(observation.phenomenonTime.hasEnd.inXSDDateTimeStamp)"
        datatype: xsd:dateTimeStamp


  #################################################
  # Optional source trace: datastream as provenance object
  #################################################
  datastream:
    sources:
      - source

    s: "ex:datastream/$(datastream['@iot.id'])"

    po:
      - p: a
        o: sosa:ObservationCollection

      - p: dct:identifier
        o: "$(datastream['@iot.id'])"

      - p: rdfs:label
        o: "$(datastream.name)"
        language: de

      - p: dct:description
        o: "$(datastream.description)"
        language: de

      - p: dct:source
        o: "$(datastream['@iot.selfLink'])~iri"

      - p: dct:modified
        o: "$(datastream.properties.infoLastUpdate)"
        datatype: xsd:dateTime

  #################################################
  # Concept: verkeerskenmerktype aantal
  #################################################
  conceptAantal:
    sources:
      - source

    s: "cl-vkt:aantal"

    po:
      - p: a
        o: skos:Concept

      - p: skos:prefLabel
        o: "aantal"
        language: nl

      - p: skos:notation
        o: "aantal"


  #################################################
  # Concept: voertuigtype auto
  #################################################
  conceptAuto:
    sources:
      - source

    s: "cl-vrt:auto"

    po:
      - p: a
        o: skos:Concept

      - p: skos:prefLabel
        o: "auto"
        language: nl

      - p: skos:notation
        o: "auto"