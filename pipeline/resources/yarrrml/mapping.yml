prefixes:
  rr: "http://www.w3.org/ns/r2rml#"
  rml: "http://semweb.mmlab.be/ns/rml#"
  ql: "http://semweb.mmlab.be/ns/ql#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  dct: "http://purl.org/dc/terms/"
  dc11: "http://purl.org/dc/elements/1.1/"
  prov: "http://www.w3.org/ns/prov#"

  sosa: "http://www.w3.org/ns/sosa/"
  time: "http://www.w3.org/2006/time#"

  geo: "http://www.opengis.net/ont/geosparql#"
  sf: "http://www.opengis.net/ont/sf#"

  # OSLO Verkeersmetingen reference vocabulary (Telraam LDES).
  verkeer: "https://data.vlaanderen.be/ns/verkeersmetingen#"
  impl: "https://implementatie.data.vlaanderen.be/ns/vsds-verkeersmetingen#"
  dv-weg: "https://data.vlaanderen.be/ns/weg#"
  dv-netwerk: "https://data.vlaanderen.be/ns/netwerk#"

  iso19156-ob: "http://def.isotc211.org/iso19156/2011/Observation#"
  iso19156-sp: "http://def.isotc211.org/iso19156/2011/SamplingPoint#"

  # Temporal classes required by the (defect-corrected) SHACL.
  iso19108: "http://def.isotc211.org/iso19108/2006/TemporalObjects#"

  # Simple-features LineString class the SHACL WegsegmentShape requires.
  sf-sg: "http://schemas.opengis.net/sf/1.0/simple_features_geometries.rdf#"

  skos: "http://www.w3.org/2004/02/skos/core#"

  # Puntreferentie.opPositie (Length) — matches the Telraam reference.
  iso19103-mp: "http://def.isotc211.org/iso19103/2015/MeasureTypes#"
  schema: "https://schema.org/"
  cdt: "https://w3id.org/cdt/"

  cl-vrt: "https://data.vlaanderen.be/doc/concept/VkmVoertuigType/"
  cl-vkt: "https://data.vlaanderen.be/doc/concept/VkmVerkeersKenmerkType/"
  cl-mit: "https://data.vlaanderen.be/doc/concept/VkmMeetInstrumentType/"
  cl-trt: "https://inspire.ec.europa.eu/codelist/LinkDirectionValue/"

  ex: "https://example.org/id/"

sources:
  source:
    access: data.json
    referenceFormulation: jsonpath
    iterator: "$"

mappings:

  #################################################
  # Verkeersmeetpunt (location)
  #
  # bemonsterdObject -> Rijrichting (which nests the Wegsegment). Point geometry
  # via the ISO 19156 sampling-point shape. Segment + direction are pre-injected
  # into the JSON by the road-snapper (_wegsegment) and direction-mapper
  # (_rijrichting) before this mapping runs.
  #################################################
  verkeersmeetpunt:
    sources:
      - source

    s: "ex:verkeersmeetpunt/$(thing['@iot.id'])"

    po:
      - p: a
        o: verkeer:Verkeersmeetpunt
      # geobserveerdObject on the measurement requires class vkm:Verkeersobject.
      - p: a
        o: verkeer:Verkeersobject

      - p: dct:identifier
        o: "$(thing.properties.assetID)"

      - p: rdfs:label
        o: "$(thing.name)"
        language: de

      - p: dct:source
        o: "$(thing['@iot.selfLink'])~iri"

      - p: dct:modified
        o: "$(thing.properties.infoLastUpdate)"
        datatype: xsd:dateTime

      - p: iso19156-sp:SF_SamplingPoint.shape
        o: "ex:geometrie/$(thing['@iot.id'])~iri"

      - p: verkeer:bemonsterdObject
        o: "ex:rijrichting/$(datastream['@iot.id'])~iri"

      # Puntreferentie locating the meetpunt on the snapped network (offset
      # along the segment = _wegsegment.offsetM).
      - p: impl:Verkeersmeetpunt.verkeersmeetpuntnetwerkreferentie
        o: "ex:puntreferentie/$(datastream['@iot.id'])~iri"


  #################################################
  # Puntreferentie: position of the meetpunt along the snapped Wegsegment
  #################################################
  puntreferentie:
    sources:
      - source

    s: "ex:puntreferentie/$(datastream['@iot.id'])"

    po:
      - p: a
        o: dv-netwerk:Puntreferentie
      - p: dv-netwerk:Puntreferentie.opPositie
        o: "ex:puntreferentie/$(datastream['@iot.id'])/positie~iri"

  puntreferentie_positie:
    sources:
      - source

    s: "ex:puntreferentie/$(datastream['@iot.id'])/positie"

    po:
      - p: a
        o: iso19103-mp:Length
      - p: schema:unitCode
        o: "m"
        datatype: cdt:ucumunit
      - p: schema:value
        o: "$(_wegsegment.offsetM)"
        datatype: xsd:double


  #################################################
  # Sampling-point geometry (the meetpunt's point)
  #################################################
  geometrie:
    sources:
      - source

    s: "ex:geometrie/$(thing['@iot.id'])"

    po:
      - p: a
        o: sf:Point
      - p: geo:asWKT
        o: "POINT ($(locations[0].location.geometry.coordinates[0]) $(locations[0].location.geometry.coordinates[1]))"
        datatype: geo:wktLiteral


  #################################################
  # Rijrichting (bemonsterdObject of the meetpunt)
  #
  # Direction code from _rijrichting.locationDirection (direction-mapper).
  # Links the Wegsegment directly via impl:Rijrichting.netwerkreferentieelement
  # (matches the Telraam reference — no intermediate Netwerkreferentie node).
  #################################################
  rijrichting:
    sources:
      - source

    s: "ex:rijrichting/$(datastream['@iot.id'])"

    po:
      - p: a
        o: dv-weg:Rijrichting

      # dvweg:rijrichting requires class skos:Concept on the code (typed below).
      - p: dv-weg:rijrichting
        o: "cl-trt:$(_rijrichting.locationDirection)~iri"

      - p: impl:Rijrichting.netwerkreferentieelement
        o: "ex:wegsegment/$(datastream['@iot.id'])~iri"


  #################################################
  # Wegsegment (the network element)
  #
  # Centerline + begin/end knoop from the injected _wegsegment.
  #################################################
  wegsegment:
    sources:
      - source

    s: "ex:wegsegment/$(datastream['@iot.id'])"

    po:
      - p: a
        o: dv-weg:Wegsegment

      - p: dv-netwerk:Link.geometriemiddellijn
        o: "ex:wegsegment/$(datastream['@iot.id'])/middellijn~iri"

      - p: dv-netwerk:beginknoop
        o: "ex:wegsegment/$(datastream['@iot.id'])/beginknoop~iri"

      - p: dv-netwerk:eindknoop
        o: "ex:wegsegment/$(datastream['@iot.id'])/eindknoop~iri"

  wegsegment_middellijn:
    sources:
      - source

    s: "ex:wegsegment/$(datastream['@iot.id'])/middellijn"

    po:
      # WegsegmentShape requires class = the sf/1.0 LineString (not sf:LineString).
      - p: a
        o: sf-sg:LineString
      - p: geo:asWKT
        o: "$(_wegsegment.centerlineWkt)"
        datatype: geo:wktLiteral

  wegsegment_beginknoop:
    sources:
      - source

    s: "ex:wegsegment/$(datastream['@iot.id'])/beginknoop"

    po:
      - p: a
        o: dv-netwerk:Knoop
      - p: dv-netwerk:Knoop.geometrie
        o: "ex:wegsegment/$(datastream['@iot.id'])/beginknoop/geom~iri"

  wegsegment_beginknoop_geom:
    sources:
      - source

    s: "ex:wegsegment/$(datastream['@iot.id'])/beginknoop/geom"

    po:
      - p: a
        o: sf:Point
      - p: geo:asWKT
        o: "$(_wegsegment.beginWkt)"
        datatype: geo:wktLiteral

  wegsegment_eindknoop:
    sources:
      - source

    s: "ex:wegsegment/$(datastream['@iot.id'])/eindknoop"

    po:
      - p: a
        o: dv-netwerk:Knoop
      - p: dv-netwerk:Knoop.geometrie
        o: "ex:wegsegment/$(datastream['@iot.id'])/eindknoop/geom~iri"

  wegsegment_eindknoop_geom:
    sources:
      - source

    s: "ex:wegsegment/$(datastream['@iot.id'])/eindknoop/geom"

    po:
      - p: a
        o: sf:Point
      - p: geo:asWKT
        o: "$(_wegsegment.eindWkt)"
        datatype: geo:wktLiteral


  #################################################
  # Sensor / meetinstrument
  #################################################
  sensor:
    sources:
      - source

    s: "ex:sensor/$(sensor['@iot.id'])"

    po:
      - p: a
        o: sosa:Sensor

      - p: dct:type
        o: "cl-mit:telraam~iri"

      - p: dct:identifier
        o: "$(sensor['@iot.id'])"

      - p: rdfs:label
        o: "$(sensor.name)"
        language: de

      - p: dct:description
        o: "$(sensor.description)"
        language: de

      - p: dct:source
        o: "$(sensor['@iot.selfLink'])~iri"


  #################################################
  # Verkeerstelling / Verkeersmeting (measurement)
  #################################################
  verkeerstelling:
    sources:
      - source

    s: "ex:verkeerstelling/$(observation['@iot.id'])"

    po:
      - p: a
        o: impl:Verkeerstelling
      - p: a
        o: verkeer:Verkeersmeting

      - p: dct:identifier
        o: "$(observation['@iot.id'])"

      - p: dct:source
        o: "$(observation['@iot.selfLink'])~iri"

      - p: prov:generatedAtTime
        o: "$(observation.resultTime)"
        datatype: xsd:dateTime

      # SHACL VerkeersmetingShape requires these (min 1).
      - p: iso19156-ob:OM_Observation.phenomenonTime
        o: "ex:tijdsinterval/$(observation['@iot.id'])~iri"

      # result is emitted as a plain string literal (the shape's sh:class on
      # result has been dropped accordingly — a literal cannot satisfy sh:class).
      - p: iso19156-ob:OM_Observation.result
        o: "$(observation.result)"

      - p: iso19156-ob:OM_Observation.resultTime
        o: "ex:tijdsinterval/$(observation['@iot.id'])/begin~iri"

      - p: verkeer:geobserveerdObject
        o: "ex:verkeersmeetpunt/$(thing['@iot.id'])~iri"

      - p: sosa:madeBySensor
        o: "ex:sensor/$(sensor['@iot.id'])~iri"

      # SHACL uses verkeer:geobserveerdKenmerk (not impl:Verkeerstelling.*).
      - p: verkeer:geobserveerdKenmerk
        o: "ex:verkeerstellingkenmerk/$(observation['@iot.id'])~iri"

      - p: impl:Verkeerstelling.tellingresultaat
        o: "$(observation.result)"
        datatype: xsd:integer


  #################################################
  # Verkeerstellingkenmerk (per-measurement)
  #
  # rijrichting from _rijrichting.measurementDirection (the actual direction of
  # this count). voertuigType + kenmerktype from the mapping.
  #################################################
  verkeerstellingkenmerk:
    sources:
      - source

    s: "ex:verkeerstellingkenmerk/$(observation['@iot.id'])"

    po:
      - p: a
        o: impl:Verkeerstellingkenmerk
      # geobserveerdKenmerk requires class vkm:Verkeerskenmerk.
      - p: a
        o: verkeer:Verkeerskenmerk

      - p: verkeer:voertuigType
        o: "cl-vrt:auto~iri"

      # VerkeerskenmerkShape requires dc11:type (min 1, skos:Concept) = the
      # kenmerk type. Keep the impl: kenmerktype too for reference-model parity.
      - p: dc11:type
        o: "cl-vkt:aantal~iri"

      - p: impl:Verkeerstellingkenmerk.kenmerktype
        o: "cl-vkt:aantal~iri"

      - p: impl:Verkeerstellingkenmerk.rijrichting
        o: "cl-trt:$(_rijrichting.measurementDirection)~iri"


  #################################################
  # Phenomenon time interval
  #################################################
  tijdsinterval:
    sources:
      - source

    s: "ex:tijdsinterval/$(observation['@iot.id'])"

    po:
      # phenomenonTime requires class TM_Object (defect-corrected from todo.com).
      - p: a
        o: iso19108:TM_Object
      - p: a
        o: time:TemporalEntity

      - p: time:hasBeginning
        o: "ex:tijdsinterval/$(observation['@iot.id'])/begin~iri"

      # Hamburg reports the interval as PT23H59M59S; the count covers one day.
      - p: time:hasXSDDuration
        o: "P1D"
        datatype: xsd:duration

  begin:
    sources:
      - source

    s: "ex:tijdsinterval/$(observation['@iot.id'])/begin"

    po:
      # resultTime requires class TM_Instant.
      - p: a
        o: iso19108:TM_Instant
      - p: a
        o: time:Instant

      - p: time:inXSDDateTimeStamp
        o: "$(observation.phenomenonTime.hasBeginning.inXSDDateTimeStamp)"
        datatype: xsd:dateTime


  #################################################
  # Codelist concepts typed as skos:Concept
  #
  # The SHACL requires skos:Concept on dvweg:rijrichting (and the kenmerk's
  # voertuigType/kenmerktype). Declare each referenced code as a skos:Concept.
  #################################################
  concept_direction_location:
    sources:
      - source
    s: "cl-trt:$(_rijrichting.locationDirection)"
    po:
      - p: a
        o: skos:Concept

  concept_direction_measurement:
    sources:
      - source
    s: "cl-trt:$(_rijrichting.measurementDirection)"
    po:
      - p: a
        o: skos:Concept

  concept_voertuigtype:
    sources:
      - source
    s: "cl-vrt:auto"
    po:
      - p: a
        o: skos:Concept

  concept_kenmerktype:
    sources:
      - source
    s: "cl-vkt:aantal"
    po:
      - p: a
        o: skos:Concept
